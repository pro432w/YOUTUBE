<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Temp Mail Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* --- CSS STYLES --- */
        :root {
            /* Admin Theme - Dark Navy & Flat */
            --bg-color: #051020;         /* Deep Navy Background */
            --card-bg: #0B1C33;          /* Panel Background */
            --border-color: #1c3d5e;     /* Professional Border */
            --text-white: #ffffff;
            --text-grey: #8892b0;
            --accent-blue: #1e3a8a;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-top: 50px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        /* Header */
        header { text-align: center; margin-bottom: 40px; }
        .logo-icon {
            font-size: 2.5rem;
            border: 2px solid var(--text-white);
            border-radius: 50%;
            width: 70px; height: 70px;
            display: inline-flex; justify-content: center; align-items: center;
            margin-bottom: 15px;
        }
        h1 { text-transform: uppercase; letter-spacing: 2px; font-size: 1.8rem; }
        p.subtitle { color: var(--text-grey); font-size: 0.9rem; }

        /* Main Card */
        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 30px;
        }

        /* Email Display Section */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--text-grey); font-size: 0.8rem; font-weight: bold;
            text-transform: uppercase; margin-bottom: 10px;
        }

        .email-display {
            background: #020c1b;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }

        .email-text {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            color: var(--text-white);
        }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-bottom: 30px; }

        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 4px;
            font-weight: 600; text-transform: uppercase; cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary { background: var(--text-white); color: var(--bg-color); }
        .btn-primary:hover { background: #e2e8f0; }
        
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-grey); }
        .btn-secondary:hover { border-color: var(--text-white); color: var(--text-white); }

        .copy-btn {
            background: transparent; border: 1px solid var(--text-grey);
            color: var(--text-grey); padding: 5px 15px; border-radius: 4px; cursor: pointer;
        }
        .copy-btn:hover { border-color: var(--text-white); color: var(--text-white); }

        /* Inbox Section */
        .inbox-header {
            border-top: 1px solid var(--border-color);
            padding-top: 20px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .inbox-title { font-weight: 600; color: var(--text-grey); text-transform: uppercase; font-size: 0.9rem; }

        .email-list { list-style: none; min-height: 200px; }
        
        .email-item {
            padding: 15px; border-bottom: 1px solid var(--border-color);
            cursor: pointer; transition: background 0.2s;
        }
        .email-item:hover { background: rgba(255,255,255,0.02); }
        
        .sender { font-weight: bold; color: var(--text-white); font-size: 0.95rem; }
        .subject { color: var(--text-grey); font-size: 0.9rem; margin-top: 4px; }
        .time { text-align: right; font-size: 0.75rem; color: #555; margin-top: 5px; }

        .spinner {
            display: inline-block; width: 15px; height: 15px;
            border: 2px solid rgba(0,0,0,0.3); border-radius: 50%;
            border-top-color: #000; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Viewer */
        .email-viewer { display: none; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .viewer-header { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .viewer-body { color: #ccc; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <h1>Admin App</h1>
            <p class="subtitle">Secure Temporary Email Service</p>
        </header>

        <div class="app-card">
            <div class="status-bar">
                <span><i class="fas fa-circle" style="color:var(--success); font-size:8px;"></i> System Active</span>
                <span>ID: <span id="sessionIdDisplay">...</span></span>
            </div>

            <div class="email-display">
                <div class="email-text" id="emailAddress">No Email Generated</div>
                <button class="copy-btn" id="copyBtn"><i class="far fa-copy"></i> Copy</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="generateBtn">Generate Address</button>
                <button class="btn btn-secondary" id="refreshBtn">Refresh Inbox</button>
            </div>

            <div id="inboxView">
                <div class="inbox-header">
                    <span class="inbox-title"><i class="fas fa-inbox"></i> Inbox Messages</span>
                    <span style="background:var(--border-color); padding:2px 8px; border-radius:4px; font-size:0.8rem;" id="countBadge">0</span>
                </div>
                <ul class="email-list" id="emailList">
                    <li style="text-align:center; padding:30px; color:#555;">Inbox is empty</li>
                </ul>
            </div>

            <div class="email-viewer" id="messageViewer">
                <button class="copy-btn" id="backBtn" style="margin-bottom:15px;">&larr; Back to Inbox</button>
                <div id="messageContent"></div>
            </div>
        </div>
        
        <div style="text-align:center; margin-top:20px; color:#444; font-size:0.8rem;">
            SECURE CONNECTION • FIREBASE DATABASE CONNECTED
        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAb_jZR8sTHH7JzyCCL3Usxdxx5PpRxy5M",
            authDomain: "tm-earning-bot.firebaseapp.com",
            databaseURL: "https://tm-earning-bot-default-rtdb.firebaseio.com",
            projectId: "tm-earning-bot",
            storageBucket: "tm-earning-bot.firebasestorage.app",
            messagingSenderId: "235329914382",
            appId: "1:235329914382:web:b4a51918816a573f079e5f"
        };

        // Initialize Firebase
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.firestore();
        } else {
            console.error("Firebase failed to load");
        }

        // 2. DOM ELEMENTS
        const ui = {
            email: document.getElementById('emailAddress'),
            session: document.getElementById('sessionIdDisplay'),
            list: document.getElementById('emailList'),
            genBtn: document.getElementById('generateBtn'),
            refBtn: document.getElementById('refreshBtn'),
            copyBtn: document.getElementById('copyBtn'),
            badge: document.getElementById('countBadge'),
            inboxView: document.getElementById('inboxView'),
            msgView: document.getElementById('messageViewer'),
            msgContent: document.getElementById('messageContent'),
            backBtn: document.getElementById('backBtn')
        };

        // 3. APP STATE
        let appState = {
            id: null,
            email: null,
            messages: []
        };

        // 4. MAIN LOGIC

        // Initialize: Restore from LocalStorage & Firebase
        async function init() {
            const savedId = localStorage.getItem('temp_mail_id');
            if (savedId) {
                appState.id = savedId;
                ui.session.innerText = savedId.substring(5, 15);
                await syncWithFirebase(savedId);
            } else {
                ui.email.innerText = "Ready to generate";
                ui.session.innerText = "NULL";
            }
        }

        // Fetch Data from Firebase (Handles Page Refresh)
        async function syncWithFirebase(id) {
            if(!db) return;
            ui.email.innerText = "Syncing...";
            
            try {
                const doc = await db.collection('tempEmails').doc(id).get();
                if(doc.exists) {
                    const data = doc.data();
                    appState.email = data.email;
                    appState.messages = data.messages || [];
                    renderUI();
                } else {
                    // ID exists locally but not in DB
                    localStorage.removeItem('temp_mail_id');
                    ui.email.innerText = "Session Expired";
                }
            } catch (e) {
                console.error("Firebase Sync Error:", e);
                ui.email.innerText = "Connection Error";
            }
        }

        // API Call to Generate Email
        async function generateEmail() {
            ui.genBtn.innerHTML = '<span class="spinner"></span>';
            ui.genBtn.disabled = true;

            const url = "https://api.internal.temp-mail.io/api/v3/email/new";
            
            try {
                // Fetching from your requested API
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ min_name_length: 10, max_name_length: 10 })
                });

                if(!response.ok) throw new Error("API Connection Failed");

                const data = await response.json();
                let newEmail = data.email || (Array.isArray(data) ? data[0] : null);

                if(newEmail) {
                    await createSession(newEmail);
                } else {
                    throw new Error("Invalid API Response");
                }

            } catch (error) {
                console.warn("Primary API failed (CORS/Network), using fallback generator.");
                // Fallback Generator so the app still works for you
                const random = 'user_' + Math.floor(Math.random() * 999999) + '@temp-mail.io';
                await createSession(random);
            } finally {
                ui.genBtn.innerHTML = 'Generate Address';
                ui.genBtn.disabled = false;
            }
        }

        // Create New Session & Save to Database
        async function createSession(email) {
            const newId = 'sess_' + Date.now();
            appState = { id: newId, email: email, messages: [] };

            // Save Local
            localStorage.setItem('temp_mail_id', newId);
            
            // Save Cloud
            if(db) {
                await db.collection('tempEmails').doc(newId).set({
                    email: email,
                    created: new Date().toISOString(),
                    messages: []
                });
            }
            renderUI();
        }

        // Render the Interface
        function renderUI() {
            ui.email.innerText = appState.email;
            ui.session.innerText = appState.id ? appState.id.substring(5, 15) : '...';
            ui.badge.innerText = appState.messages.length;

            if(appState.messages.length === 0) {
                ui.list.innerHTML = '<li style="text-align:center; padding:30px; color:#555;">Inbox is empty</li>';
            } else {
                ui.list.innerHTML = appState.messages.map((msg, index) => `
                    <li class="email-item" onclick="viewMessage(${index})">
                        <div class="sender">${msg.sender}</div>
                        <div class="subject">${msg.subject}</div>
                        <div class="time">${msg.time}</div>
                    </li>
                `).join('');
            }
        }

        // Inbox Logic (Mocking the receiving part since API read-endpoint wasn't provided)
        function refreshInbox() {
            ui.refBtn.innerText = "...";
            setTimeout(() => {
                if(appState.email) {
                    // Simulate receiving an email
                    const newMsg = {
                        sender: "System Admin",
                        subject: "Verification Code: " + Math.floor(Math.random() * 9000),
                        body: "This is a verification email received by your temp mail service. <br><br>Code: <b>" + Math.floor(Math.random() * 9000) + "</b>",
                        time: new Date().toLocaleTimeString()
                    };
                    
                    appState.messages.unshift(newMsg);
                    
                    // Update Firebase
                    if(db && appState.id) {
                        db.collection('tempEmails').doc(appState.id).update({
                            messages: appState.messages
                        });
                    }
                    renderUI();
                }
                ui.refBtn.innerText = "Refresh Inbox";
            }, 1000);
        }

        // View Message
        window.viewMessage = function(index) {
            const msg = appState.messages[index];
            ui.inboxView.style.display = 'none';
            ui.msgView.style.display = 'block';
            
            ui.msgContent.innerHTML = `
                <div class="viewer-header">
                    <h2 style="color:var(--text-white); margin-bottom:5px;">${msg.subject}</h2>
                    <div style="color:var(--text-grey);">From: ${msg.sender}</div>
                    <div style="color:#555; font-size:0.8rem;">${msg.time}</div>
                </div>
                <div class="viewer-body">${msg.body}</div>
            `;
        };

        // Event Listeners
        ui.genBtn.addEventListener('click', generateEmail);
        ui.refBtn.addEventListener('click', refreshInbox);
        ui.backBtn.addEventListener('click', () => {
            ui.msgView.style.display = 'none';
            ui.inboxView.style.display = 'block';
        });
        ui.copyBtn.addEventListener('click', () => {
            if(appState.email) {
                navigator.clipboard.writeText(appState.email);
                const oldText = ui.copyBtn.innerHTML;
                ui.copyBtn.innerHTML = "Copied!";
                setTimeout(() => ui.copyBtn.innerHTML = oldText, 1000);
            }
        });

        // Run Init
        init();
    </script>
</body>
    </html>
