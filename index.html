<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YT Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @-webkit-keyframes spinner { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen relative">

    <nav class="p-4 bg-gray-800 shadow-lg flex justify-between items-center">
        <h1 class="text-2xl font-bold text-red-500"><i class="fab fa-youtube"></i> YT Loader</h1>
        <button onclick="toggleHistory()" class="text-xl p-2 hover:bg-gray-700 rounded-full">
            <i class="fas fa-history text-blue-400"></i>
        </button>
    </nav>

    <div class="container mx-auto px-4 py-10 max-w-2xl">
        
        <div class="bg-gray-800 p-6 rounded-xl shadow-xl">
            <label class="block mb-2 text-sm font-medium text-gray-300">Paste YouTube Link</label>
            <div class="flex gap-2">
                <input type="text" id="urlInput" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-red-500 transition" placeholder="https://youtube.com/watch?v=...">
                <button onclick="fetchInfo()" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded font-bold transition">GO</button>
            </div>
        </div>

        <div id="loading" class="hidden flex justify-center mt-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        </div>

        <div id="selectionArea" class="hidden mt-6 bg-gray-800 p-6 rounded-xl shadow-xl animate-fade-in">
            <div class="flex gap-4 mb-4">
                <img id="thumb" src="" class="w-1/3 rounded-lg object-cover">
                <div class="w-2/3">
                    <h3 id="videoTitle" class="font-bold text-lg leading-tight mb-2"></h3>
                    <p id="videoDuration" class="text-sm text-gray-400"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Select Quality</label>
                    <select id="videoSelect" class="w-full bg-gray-700 p-2 rounded"></select>
                </div>
                <div>
                    <label class="block text-sm mb-1">Select Audio</label>
                    <select id="audioSelect" class="w-full bg-gray-700 p-2 rounded"></select>
                </div>
            </div>

            <button onclick="startDownload()" class="w-full mt-4 bg-green-600 hover:bg-green-700 py-3 rounded font-bold transition">
                <i class="fas fa-download"></i> Download & Play
            </button>
        </div>

        <div id="playerArea" class="hidden mt-6 bg-gray-800 p-4 rounded-xl shadow-xl">
            <h3 class="text-green-400 font-bold mb-2">Download Ready! (Auto-deletes in 7m)</h3>
            <video id="mainPlayer" controls class="w-full rounded-lg shadow-lg">
                <source id="videoSource" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <a id="downloadLink" href="" download class="block text-center mt-3 text-blue-400 hover:underline">Download File Directly</a>
        </div>
    </div>

    <div id="historyPanel" class="fixed top-0 right-0 h-full w-80 bg-gray-900 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 p-4 overflow-y-auto border-l border-gray-700">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-xl font-bold">Downloads History</h2>
            <button onclick="toggleHistory()" class="text-red-500"><i class="fas fa-times"></i></button>
        </div>
        <div id="historyList" class="space-y-3">
            </div>
    </div>

    <script>
        let currentUrl = "";

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert("Please enter a URL");
            currentUrl = url;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('selectionArea').classList.add('hidden');
            document.getElementById('playerArea').classList.add('hidden');

            try {
                const res = await fetch('/get-info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('videoDuration').innerText = data.duration;

                const vSelect = document.getElementById('videoSelect');
                vSelect.innerHTML = "";
                data.videos.forEach(v => {
                    vSelect.innerHTML += `<option value="${v.format_id}">${v.resolution} (${v.ext})</option>`;
                });

                const aSelect = document.getElementById('audioSelect');
                aSelect.innerHTML = "";
                data.audios.forEach(a => {
                    aSelect.innerHTML += `<option value="${a.format_id}">${a.note} (${a.ext})</option>`;
                });

                document.getElementById('selectionArea').classList.remove('hidden');

            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function startDownload() {
            const vId = document.getElementById('videoSelect').value;
            const aId = document.getElementById('audioSelect').value;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('selectionArea').classList.add('hidden');

            try {
                const res = await fetch('/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: currentUrl, video_id: vId, audio_id: aId})
                });
                const data = await res.json();

                if(data.status === 'success') {
                    const player = document.getElementById('mainPlayer');
                    const source = document.getElementById('videoSource');
                    const link = document.getElementById('downloadLink');
                    
                    source.src = data.file_url;
                    link.href = data.file_url;
                    player.load();
                    player.play();

                    document.getElementById('playerArea').classList.remove('hidden');
                    refreshHistory();
                } else {
                    alert("Download Failed");
                }
            } catch (e) {
                alert("Error downloading");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function refreshHistory() {
            const res = await fetch('/history');
            const files = await res.json();
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            
            if(files.length === 0) list.innerHTML = "<p class='text-gray-500 text-center'>No active downloads</p>";

            files.forEach(f => {
                list.innerHTML += `
                    <div class="bg-gray-800 p-3 rounded flex justify-between items-center">
                        <span class="text-sm truncate w-40">${f.filename}</span>
                        <a href="${f.url}" target="_blank" class="text-green-400 hover:text-green-300"><i class="fas fa-play"></i></a>
                    </div>
                `;
            });
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            if(panel.classList.contains('translate-x-full')) {
                panel.classList.remove('translate-x-full');
                refreshHistory();
            } else {
                panel.classList.add('translate-x-full');
            }
        }
    </script>
</body>
</html>
