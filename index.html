<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Temp Mail</title>
    <style>
        /* CSS Styles */
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .email-box {
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed #ccc;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 24px;
        }

        #email-address {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.1rem;
            color: #555;
            word-break: break-all;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            width: 100%;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .copy-btn:hover {
            text-decoration: underline;
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Temp Mail Generator</h1>
        
        <div class="email-box">
            <span id="email-address">Click Generate...</span>
            <button class="copy-btn" id="copy-btn" style="display: none;" onclick="copyToClipboard()">Copy</button>
        </div>

        <button class="btn" id="generate-btn" onclick="generateEmail()">Generate New Email</button>

        <p class="status" id="status-msg"></p>
    </div>

    <script>
        // API Configuration
        const API_URL = "https://api.internal.temp-mail.io/api/v3/email/new";
        
        // DOM Elements
        const emailDisplay = document.getElementById('email-address');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const statusMsg = document.getElementById('status-msg');

        async function generateEmail() {
            // UI Loading State
            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";
            statusMsg.innerText = "";
            copyBtn.style.display = "none";
            emailDisplay.innerText = "Loading...";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        min_name_length: 10,
                        max_name_length: 10
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Assuming the API returns JSON like: { "email": "example@domain.com", ... }
                // Note: Adjust 'data.email' if the API response structure is different
                if (data && data.email) {
                    emailDisplay.innerText = data.email;
                    copyBtn.style.display = "block";
                    statusMsg.innerText = "New email generated successfully!";
                } else {
                    throw new Error("Invalid API response format");
                }

            } catch (error) {
                console.error('Error:', error);
                emailDisplay.innerText = "Error!";
                statusMsg.innerText = "Failed to generate email. Check console.";
                statusMsg.style.color = "red";
            } finally {
                // Reset Button
                generateBtn.disabled = false;
                generateBtn.innerText = "Generate New Email";
            }
        }

        function copyToClipboard() {
            const emailText = emailDisplay.innerText;
            navigator.clipboard.writeText(emailText).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                }, 2000);
            });
        }
    </script>
</body>
</html>
